name: CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bot/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'langgraph.production.json'
      - '.dockerignore'
      - 'prompts/**'
      - '.github/workflows/cd.yml'

env:
  RAILWAY_PROJECT_ID: b634c145-ac79-48e5-b197-4ac2793c9d3b
  RAILWAY_ENVIRONMENT_ID: 941d8f05-ff27-4a76-934e-260a5365b2e5

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (includes langgraph-cli for server build)
        run: uv sync

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build bot image
        run: docker build -f bot/Dockerfile -t dolevsan/fitpal-bot:latest --platform linux/amd64 .

      - name: Build server image
        run: uv run langgraph build -t dolevsan/fitpal-server:latest -c langgraph.production.json --platform linux/amd64
        env:
          PYTHONIOENCODING: utf-8

      - name: Push images to Docker Hub
        run: |
          docker push dolevsan/fitpal-bot:latest
          docker push dolevsan/fitpal-server:latest

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Redeploy services on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway redeploy -s fitpal-bot -y
          railway redeploy -s langgraph-server -y
