# FitPal user-facing strings — Hebrew skeleton.
#
# Every value is currently TODO_HE-prefixed with the English fallback.
# Replace each value with the Hebrew translation. The TODO_HE prefix
# satisfies the non-empty-string parity rule, so the loader will boot,
# but any user running with BOT_LANGUAGE=he will see the literal
# "TODO_HE:" prefix until you translate. That's intentional — it makes
# untranslated strings loud.
#
# Keep keys in sync with src/i18n/en.yaml and the Messages TypedDict.
# Keep placeholder syntax intact: {name}, {cals}, {protein}, {carbs}, {fat}.

# --- Onboarding ---
