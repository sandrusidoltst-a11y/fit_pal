[project]
name = "fit-pal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.8",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.7",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.46",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.11",
    "httpx>=0.28.1",
    "aiogram>=3.25",
    "supabase>=2.28.0",
    "fastapi>=0.135.2",
    "greenlet>=3.3.1",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.12",
    "langsmith-fetch>=0.3.1",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
    "anyio>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pandas-stubs>=3.0.0.260204",
    "types-sqlalchemy>=1.4.53.38",
    "langgraph-sdk>=0.3.8",
    "aiosqlite>=0.19.0",
    "ipykernel>=7.2.0",
]

[tool.ruff]
exclude = ["notebooks/", ".claude/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
